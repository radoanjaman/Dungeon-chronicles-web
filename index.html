<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Dungeon Chronicles - Web Edition</title>
<script>
  window.addEventListener('error', function(e) {
    console.error('WINDOW ERROR CAUGHT:', e.message, e.filename, e.lineno, e.error);
  });
  window.addEventListener('unhandledrejection', function(e) {
    console.error('PROMISE REJECTION CAUGHT:', e.reason);
  });
</script>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0d0b0a;
    color: #e8dcc8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  header {
    flex: 0 0 44px;
    min-height: 44px;
    padding: 0 16px;
    font-size: 13px;
    display: flex;
    gap: 14px;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, #24201c 0%, #161311 100%);
    border-bottom: 1px solid #3a322b;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
    color: #f7ca65;
    letter-spacing: 0.5px;
  }
  .brand span.badge {
    font-size: 11px;
    background: #463b2f;
    color: #e2d2ba;
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 600;
  }
  .controls-hint {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #b8aba0;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .controls-hint kbd {
    background: #2f2a25;
    border: 1px solid #554a3f;
    border-radius: 3px;
    padding: 1px 5px;
    color: #fff;
    font-family: monospace;
    font-size: 11px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.4);
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn {
    background: #2c251f;
    color: #e8dcc8;
    border: 1px solid #4a3e35;
    border-radius: 5px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  .btn:hover {
    background: #3e342b;
    border-color: #6a5a4d;
    color: #fff;
  }
  .audio-indicator {
    padding: 4px 9px;
    font-size: 12px;
    border-radius: 4px;
    background: #1f3b25;
    color: #79d68b;
    border: 1px solid #2e5f38;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .audio-indicator.muted {
    background: #3c1e1e;
    color: #ff9191;
    border-color: #632d2d;
  }

  /* 1.2 CSS Architecture: Fixed-size stage + uniform transform */
  #container {
    flex: 1 1 0;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }
  #viewport {
    position: relative;
    flex: none;
    overflow: hidden;
    width: 1664px;
    height: 896px;
  }
  #stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1664px;
    height: 896px;
    transform-origin: 0 0;
    overflow: hidden;
    background: #000;
  }
  /* Keep CheerpJ's layers at FIXED native pixel size so it never re-layouts */
  #stage #cheerpjDisplay {
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    width: 1664px !important;
    height: 896px !important;
    margin: 0 !important;
    border: 0 !important;
  }
  #stage .cjWindow {
    left: 0 !important;
    top: 0 !important;
    width: 1664px !important;
    height: 896px !important;
  }
  #stage .cjWindow canvas {
    left: 0 !important;
    top: 0 !important;
    width: 1664px !important;
    height: 896px !important;
  }

  /* Loading overlay */
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: radial-gradient(circle, #25201b 0%, #0d0b0a 80%);
    z-index: 20;
    gap: 16px;
    transition: opacity 0.4s ease;
  }
  #loading.fade-out { opacity: 0; pointer-events: none; }
  .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid rgba(247, 202, 101, 0.2);
    border-top-color: #f7ca65;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading h2 { margin: 0; font-size: 22px; color: #f7ca65; }
  #loading p {
    margin: 0;
    max-width: 440px;
    line-height: 1.6;
    font-size: 14px;
    color: #b8aba0;
  }

  /* Audio prompt */
  #audio-prompt {
    display: none;
    position: absolute;
    bottom: 24px;
    background: rgba(22, 19, 17, 0.92);
    border: 1px solid #f7ca65;
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    z-index: 30;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  /* Debug overlay */
  #debug-overlay {
    display: none;
    position: fixed;
    top: 50px;
    left: 10px;
    background: rgba(0,0,0,0.85);
    color: #0f0;
    font: 12px/1.5 monospace;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #0f0;
    z-index: 1000;
    pointer-events: none;
    white-space: pre;
  }
  #debug-overlay.visible { display: block; }
  #debug-play-rect {
    display: none;
    position: fixed;
    border: 2px solid #f7ca65;
    pointer-events: none;
    z-index: 1001;
  }
  #debug-play-rect.visible { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="brand">
      <span>Dungeon Chronicles</span>
      <span class="badge">Web</span>
    </div>
    <div class="controls-hint">
      <span>Move: <kbd>A</kbd>/<kbd>D</kbd> or <kbd>←</kbd>/<kbd>→</kbd></span>
      <span>Jump: <kbd>Space</kbd>/<kbd>W</kbd></span>
      <span>Attack: <kbd>F</kbd></span>
      <span>Pause: <kbd>Esc</kbd></span>
    </div>
    <div class="actions">
      <div id="audio-btn" class="audio-indicator" title="Click to mute/unmute audio">🔊 Audio: On</div>
      <button id="fullscreen-btn" class="btn" title="Toggle Fullscreen">⛶ Fullscreen</button>
    </div>
  </header>
  <div id="container">
    <div id="viewport">
      <div id="stage">
        <div id="loading">
          <div class="spinner"></div>
          <h2>Loading Dungeon Chronicles</h2>
          <p>Initializing WebAssembly engine &amp; game assets…<br>Ready to play in a few seconds!</p>
        </div>
      </div>
    </div>
    <div id="audio-prompt">🎵 Click anywhere to enable sound &amp; start game!</div>
  </div>
</div>

<div id="debug-overlay"></div>
<div id="debug-play-rect"></div>

<script type="module">
  const GW = 1664;
  const GH = 896;
  const container = document.getElementById('container');
  const viewport  = document.getElementById('viewport');
  const stage     = document.getElementById('stage');
  const audioBtn  = document.getElementById('audio-btn');
  const audioPrompt = document.getElementById('audio-prompt');
  const debugPanel = document.getElementById('debug-overlay');
  const debugPlayRect = document.getElementById('debug-play-rect');
  const DEBUG = location.search.includes('debug');

  // =========================================================================
  // 1.3 FIT LOGIC: UNIFORM TRANSFORM SCALING
  // =========================================================================
  let lastClient = [0, 0];
  let lastGame = [0, 0];
  let rafFps = 0, rafCount = 0, rafLast = performance.now();
  let scale = 1;
  function fit() {
    const w = container.clientWidth;
    const h = container.clientHeight;
    if (w <= 0 || h <= 0) return;
    scale = Math.min(w / GW, h / GH);
    viewport.style.width  = Math.floor(GW * scale) + 'px';
    viewport.style.height = Math.floor(GH * scale) + 'px';
    stage.style.transform = 'scale(' + scale + ')';
    if (DEBUG) updateDebugOverlay();
  }

  new ResizeObserver(fit).observe(container);
  window.addEventListener('resize', fit);
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', () => requestAnimationFrame(fit));
  fit();

  // =========================================================================
  // 1.4 POINTER MAPPING: UNIFIED FRESH RECT INTERCEPT
  // =========================================================================
  function adaptPointer(e) {
    if (e._dcScaled) return;
    if (!stage.contains(e.target)) return;
    const disp = document.getElementById('cheerpjDisplay') || stage;
    const rect = disp.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return;
    const sx = rect.width / GW;
    const sy = rect.height / GH;
    e._dcScaled = true;

    const fx = rect.left + (e.clientX - rect.left) / sx;
    const fy = rect.top  + (e.clientY - rect.top)  / sy;

    if (DEBUG) {
      lastClient = [Math.round(e.clientX), Math.round(e.clientY)];
      lastGame = [Math.round((e.clientX - rect.left) / sx), Math.round((e.clientY - rect.top) / sy)];
      updateDebugOverlay();
    }

    try {
      for (const [k, v] of [
        ['clientX', fx],
        ['clientY', fy],
        ['x', fx],
        ['y', fy],
        ['pageX', fx + window.scrollX],
        ['pageY', fy + window.scrollY]
      ]) {
        Object.defineProperty(e, k, { get: () => v, configurable: true });
      }
      if (e.movementX !== undefined) {
        Object.defineProperty(e, 'movementX', { get: () => e.movementX / sx, configurable: true });
      }
      if (e.movementY !== undefined) {
        Object.defineProperty(e, 'movementY', { get: () => e.movementY / sy, configurable: true });
      }
    } catch (_) {}
  }

  [
    'pointerdown', 'pointerup', 'pointermove', 'pointerleave', 'pointerenter',
    'wheel', 'contextmenu', 'click', 'mousedown', 'mouseup', 'mousemove'
  ].forEach(t => window.addEventListener(t, adaptPointer, { capture: true, passive: false }));

  // =========================================================================
  // AUDIO ENGINE (Retained unmodified)
  // =========================================================================
  const SONG_FILES = ["audio/menu.wav", "audio/level1.wav", "audio/level2.wav"];
  const EFFECT_FILES = [
    "audio/die.wav", "audio/jump.wav", "audio/gameover.wav",
    "audio/lvlcompleted.wav", "audio/attack1.wav", "audio/attack2.wav", "audio/attack3.wav"
  ];

  let masterVolume = 0.5;
  let isSongMuted = false;
  let isEffectMuted = false;
  let currentSongIndex = -1;
  let activeSongAudio = null;
  let pendingSongIndex = 0;
  let audioContextUnlocked = false;

  const songElements = SONG_FILES.map((src, i) => {
    const a = new Audio(src);
    a.loop = true;
    a.preload = i === 0 ? "auto" : "none";
    return a;
  });

  const effectBuffers = new Array(EFFECT_FILES.length).fill(null);
  let audioCtx = null;

  EFFECT_FILES.forEach((src, i) => {
    fetch(src).then(r => r.arrayBuffer()).then(ab => {
      effectBuffers[i] = ab;
    }).catch(() => {});
  });

  function initAudioContext() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  const decodedBuffers = new Array(EFFECT_FILES.length).fill(null);
  let decodeStarted = false;

  function decodeEffects() {
    if (decodeStarted || !audioCtx) return;
    decodeStarted = true;
    effectBuffers.forEach((ab, i) => {
      if (!ab) return;
      audioCtx.decodeAudioData(ab.slice(0))
        .then(buf => { decodedBuffers[i] = buf; })
        .catch(() => {});
    });
  }

  function unlockAudio() {
    initAudioContext();
    decodeEffects();
    audioContextUnlocked = true;
    audioPrompt.style.display = "none";
    if (pendingSongIndex >= 0) {
      playSong(pendingSongIndex);
      pendingSongIndex = -1;
    }
  }

  window.addEventListener("pointerdown", unlockAudio, { passive: true });
  window.addEventListener("keydown",     unlockAudio, { passive: true });

  function playSong(songIdx) {
    if (songIdx < 0 || songIdx >= songElements.length) return;
    currentSongIndex = songIdx;
    if (!audioContextUnlocked) {
      pendingSongIndex = songIdx;
      audioPrompt.style.display = "block";
      return;
    }
    if (activeSongAudio && activeSongAudio !== songElements[songIdx]) {
      activeSongAudio.pause();
      activeSongAudio.currentTime = 0;
    }
    activeSongAudio = songElements[songIdx];
    if (activeSongAudio.preload === "none") activeSongAudio.preload = "auto";
    activeSongAudio.volume = isSongMuted ? 0 : masterVolume;
    activeSongAudio.play().catch(() => {
      pendingSongIndex = songIdx;
      audioPrompt.style.display = "block";
    });
  }

  function stopSong() {
    pendingSongIndex = -1;
    if (activeSongAudio) {
      activeSongAudio.pause();
      activeSongAudio.currentTime = 0;
    }
  }

  function playEffect(effectIdx) {
    if (isEffectMuted || effectIdx < 0 || effectIdx >= EFFECT_FILES.length) return;
    const vol = Math.min(1, masterVolume * 1.2);
    if (audioCtx && decodedBuffers[effectIdx]) {
      const src = audioCtx.createBufferSource();
      src.buffer = decodedBuffers[effectIdx];
      const gain = audioCtx.createGain();
      gain.gain.value = isEffectMuted ? 0 : vol;
      src.connect(gain).connect(audioCtx.destination);
      src.start();
      return;
    }
    const sound = new Audio(EFFECT_FILES[effectIdx]);
    sound.volume = vol;
    sound.play().catch(() => {});
  }

  function setVolume(vol) {
    masterVolume = Math.max(0, Math.min(1, vol));
    if (activeSongAudio) activeSongAudio.volume = isSongMuted ? 0 : masterVolume;
    updateAudioBtn();
  }

  function toggleSongMute() {
    isSongMuted = !isSongMuted;
    if (activeSongAudio) activeSongAudio.volume = isSongMuted ? 0 : masterVolume;
    updateAudioBtn();
  }

  function toggleEffectMute() {
    isEffectMuted = !isEffectMuted;
    updateAudioBtn();
  }

  function updateAudioBtn() {
    if (isSongMuted && isEffectMuted) {
      audioBtn.className = "audio-indicator muted";
      audioBtn.textContent = "🔇 Audio: Muted";
    } else {
      audioBtn.className = "audio-indicator";
      audioBtn.textContent = `🔊 Audio: ${Math.round(masterVolume * 100)}%`;
    }
  }

  audioBtn.addEventListener("click", () => {
    unlockAudio();
    if (isSongMuted && isEffectMuted) {
      isSongMuted = false; isEffectMuted = false;
    } else {
      isSongMuted = true; isEffectMuted = true;
    }
    if (activeSongAudio) activeSongAudio.volume = isSongMuted ? 0 : masterVolume;
    updateAudioBtn();
  });

  // JNI Bridges
  window.Java_audio_AudioPlayer_jsPlaySong = function(lib, song) {
    const id = typeof song === "number" ? song : (typeof lib === "number" ? lib : 0);
    playSong(id);
  };
  window.Java_audio_AudioPlayer_jsStopSong = function() { stopSong(); };
  window.Java_audio_AudioPlayer_jsPlayEffect = function(lib, effect) {
    const id = typeof effect === "number" ? effect : (typeof lib === "number" ? lib : 0);
    playEffect(id);
  };
  window.Java_audio_AudioPlayer_jsSetVolume = function(lib, volume) {
    const v = typeof volume === "number" ? volume : (typeof lib === "number" ? lib : 0.5);
    setVolume(v);
  };
  window.Java_audio_AudioPlayer_jsToggleSongMute   = function() { toggleSongMute(); };
  window.Java_audio_AudioPlayer_jsToggleEffectMute = function() { toggleEffectMute(); };

  window.Java_gamestates_Credits_jsOpenUrl = function(lib, url) {
    const target = typeof url === "string" ? url
                 : typeof lib === "string" ? lib
                 : "https://www.linkedin.com/in/radoanmoktakenjaman/";
    window.open(target, "_blank", "noopener,noreferrer");
  };

  // =========================================================================
  // FULLSCREEN & FOCUS
  // =========================================================================
  const fullscreenBtn = document.getElementById("fullscreen-btn");
  fullscreenBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      container.requestFullscreen().catch(() => {});
      fullscreenBtn.textContent = "✕ Exit Fullscreen";
    } else {
      document.exitFullscreen().catch(() => {});
      fullscreenBtn.textContent = "⛶ Fullscreen";
    }
  });
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) fullscreenBtn.textContent = "⛶ Fullscreen";
    fit();
  });

  stage.addEventListener("click", () => {
    const canvas = stage.querySelector("canvas");
    if (canvas) canvas.focus();
  });

  // =========================================================================
  // 1.5 START CHEERPJ: ATTACH TO #stage
  // =========================================================================
  const loadingElem = document.getElementById("loading");

  function waitForCanvas() {
    return new Promise(resolve => {
      const existing = stage.querySelector(".cjWindow canvas");
      if (existing) { resolve(existing); return; }
      const obs = new MutationObserver(() => {
        const c = stage.querySelector(".cjWindow canvas");
        if (c) { obs.disconnect(); resolve(c); }
      });
      obs.observe(stage, { childList: true, subtree: true });
    });
  }

  try {
    const initOpts = {
      status: "none",
      clipboardMode: "system",
      execCallback: function(cmdPath, argsArray) {
        if (Array.isArray(argsArray)) {
          const url = argsArray.find(a => typeof a === "string" &&
            (a.startsWith("http://") || a.startsWith("https://")));
          if (url) { window.open(url, "_blank", "noopener,noreferrer"); return 0; }
        }
        return 0;
      }
    };
    if (DEBUG) {
      initOpts.javaProperties = ["dc.debug=true"];
    }

    // Intercept CheerpJ's initial display metric query so the Swing window & canvas
    // are created at the true native 1664x896 dimensions, even when CSS transform is active
    let cheerpjInitComplete = false;
    const origGBCR = Element.prototype.getBoundingClientRect;
    Element.prototype.getBoundingClientRect = function() {
      const rect = origGBCR.apply(this, arguments);
      if (!cheerpjInitComplete && this.id === 'cheerpjDisplay') {
        return {
          left: rect.left,
          top: rect.top,
          right: rect.left + GW,
          bottom: rect.top + GH,
          width: GW,
          height: GH,
          x: rect.x,
          y: rect.y,
          toJSON: () => ({})
        };
      }
      return rect;
    };

    await cheerpjInit(initOpts);

    cheerpjCreateDisplay(GW, GH, stage);

    waitForCanvas().then(() => {
      cheerpjInitComplete = true;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        loadingElem.classList.add("fade-out");
        setTimeout(() => { loadingElem.remove(); }, 450);
      }));
    });

    await cheerpjRunMain("main.MainClass", "/app/dungeon-chronicles.jar");
  } catch (e) {
    if (loadingElem) {
      loadingElem.innerHTML = `
        <h2 style="color:#ff6b6b">Game Failed to Start</h2>
        <p style="color:#e8dcc8; max-width:500px">An error occurred during initialization:<br><code>${e}</code></p>
        <button class="btn" onclick="location.reload()">Retry</button>
      `;
    }
  }

  // =========================================================================
  // 1.6 DEBUG OVERLAY (?debug)
  // =========================================================================
  function countRaf(now) {
    rafCount++;
    if (now - rafLast >= 1000) {
      rafFps = rafCount;
      rafCount = 0;
      rafLast = now;
    }
    requestAnimationFrame(countRaf);
  }
  if (DEBUG) requestAnimationFrame(countRaf);

  function updateDebugOverlay() {
    if (!DEBUG) return;
    debugPanel.classList.add('visible');
    debugPlayRect.classList.add('visible');

    const disp = document.getElementById('cheerpjDisplay') || stage;
    const rect = disp.getBoundingClientRect();

    debugPanel.textContent =
      `DPR: ${window.devicePixelRatio}\n` +
      `Container: ${container.clientWidth}x${container.clientHeight}\n` +
      `Scale: ${scale.toFixed(4)}\n` +
      `Pointer client: (${lastClient[0]}, ${lastClient[1]})\n` +
      `Pointer game:   (${lastGame[0]}, ${lastGame[1]})\n` +
      `rAF FPS: ${rafFps}`;

    // Outline PLAY button in game coords x 692-972, y 260-372
    debugPlayRect.style.left   = (rect.left + 692 * scale) + 'px';
    debugPlayRect.style.top    = (rect.top  + 260 * scale) + 'px';
    debugPlayRect.style.width  = ((972 - 692) * scale) + 'px';
    debugPlayRect.style.height = ((372 - 260) * scale) + 'px';
  }
</script>
</body>
</html>
